# Go to sleep after 5 minutes (5*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y

CONFIG_ZMK_POINTING=y

# ZMK Studio is enabled per-board in build.yaml
# (snippet: studio-rpc-usb-uart + -DCONFIG_ZMK_STUDIO=y on the left/central half),
# since this .conf is shared by both halves.
# Uncomment to skip the &studio_unlock requirement (less secure):
# CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_DISPLAY_HIDE_MOMENTARY_LAYERS=y
# CONFIG_ZMK_DISPLAY_FULL_REFRESH_PERIOD=30000
# CONFIG_IL0323_INVERT=y
CONFIG_CUSTOM_WIDGET_LAYER_STATUS_HIDE_HEADING=y
CONFIG_IL0323_ALTERNATIVE_REFRESH=y
